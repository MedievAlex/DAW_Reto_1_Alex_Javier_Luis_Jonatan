<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101820">
    <title>Iniciar sesión | Almacén</title>

</head>
<body>
    <main>
        <div>
            <img src="../App/view/assets/logo/CF.png" alt="">
            <p>Gestión de almacén</p>
        </div>
        <h1>Iniciar sesión</h1>
        <p>Introduce tus credenciales para acceder al sistema.</p>

        <form id="form-login" autocomplete="on">
            <label for="nombre_usuario">Nombre de usuario</label>
            <input id="nombre_usuario" name="nombre_usuario" type="text" autocomplete="username" required autofocus>

            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>

            <button type="submit">Entrar</button>
            <p id="login-error" class="oculto" role="alert" aria-live="polite"></p>
        </form>
    </main>
    <script src="../App/view/js/auth.js"></script>
</body>
</html>
