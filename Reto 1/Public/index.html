<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión - Inventario inteligente</title>

    <link rel="stylesheet" href="../App/view/styles/global.css">
    <link rel="stylesheet" href="../App/view/styles/login.css">
    <script src="../App/view/js/auth.js" defer></script>
    <link rel="shortcut icon" type="image/ico" href="../assets/logo/CF.ico">
</head>

<!-- data-theme: 1, 2 o 3 (paletas definidas en global.css) -->
<body data-theme="1">
    <main>
        <form id="form-login" novalidate>
            <img src="../App/view/assets/logo/CF.png" alt="Logotipo del centro">

            <h1>Iniciar sesión</h1>

            <p id="login-error" class="err oculto" role="alert"></p>

            <div>
                <label for="nombre_usuario">Nombre de usuario</label>
                <input type="text" id="nombre_usuario" name="nombre_usuario" maxlength="60"
                    autocomplete="username" required autofocus>
            </div>

            <div>
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" maxlength="72"
                    autocomplete="current-password" required>
            </div>

            <button type="submit">Entrar</button>
        </form>
    </main>
</body>

</html>
